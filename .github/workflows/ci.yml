name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies and PyTorch
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest numpy scipy pandas attrs
        
        # Check if an NVIDIA GPU driver is available on the machine
        if command -v nvidia-smi &> /dev/null; then
          echo "CUDA hardware detected! Installing PyTorch with CUDA support."
          python -m pip install torch --index-url https://pytorch.org
        else
          echo "No CUDA hardware detected. Installing CPU-optimized PyTorch."
          python -m pip install torch --index-url https://pytorch.org
        fi
      shell: bash

    - name: Run test suite with pytest
      run: |
        pytest
