name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run tests on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Detect CUDA and Install Matching PyTorch
      run: |
        python -m pip install --upgrade pip
        python -m pip install --no-cache-dir pytest numpy scipy attrs
        
        # 1. Check if NVIDIA tools exist on the system
        if command -v nvcc &> /dev/null; then
          # Extract major and minor version numbers (e.g., 12.1 or 13.2)
          CUDA_VERSION=$(nvcc --version | grep -oP 'release \K[0-9]+\.[0-9]+' || nvcc --version | grep -o 'release [0-9]\+\.[0-9]\+' | cut -d' ' -f2)
          echo "Detected CUDA Toolkit Version: $CUDA_VERSION"
          
          # Clean periods to match PyTorch wheels format (e.g., 12.1 -> cu121, 13.2 -> cu132)
          WHL_TAG="cu$(echo $CUDA_VERSION | tr -d '.')"
          echo "Targeting PyTorch Wheel Index Tag: $WHL_TAG"
          
          # Install PyTorch using the dynamically parsed tag
          python -m pip install --no-cache-dir torch --index-url "https://pytorch.org/whl/{WHL_TAG}"
          
        elif command -v nvidia-smi &> /dev/null; then
          # Fallback check via nvidia-smi if driver is active but toolkit path isn't exposed
          CUDA_VERSION=$(nvidia-smi | grep -oP 'CUDA Version: \K[0-9]+\.[0-9]+' || nvidia-smi | grep -o 'CUDA Version: [0-9]\+\.[0-9]\+' | cut -d':' -f2 | tr -d ' ')
          echo "Detected CUDA Driver Version: $CUDA_VERSION"
          
          WHL_TAG="cu$(echo $CUDA_VERSION | tr -d '.')"
          python -m pip install --no-cache-dir torch --index-url "https://pytorch.org/whl/{WHL_TAG}"
          
        else
          echo "No local CUDA environment found. Defaulting to CPU-optimized PyTorch build."
          python -m pip install --no-cache-dir torch
        fi
      shell: bash

    - name: Run test suite with pytest
      run: |
        pytest
